name: chefai

services:
  backend:
    build: ./backend
    image: chefai-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Ghi đè giá trị trong backend/.env (dành cho npm run dev ở cổng 3000) để link trong email trỏ đúng địa chỉ.
      # Trên VPS đặt CORS_ORIGIN=https://chefai.hbest.net trong file .env ở thư mục gốc.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: chefai-frontend
    restart: unless-stopped
    ports:
      # FRONTEND_BIND=127.0.0.1 trên VPS để chỉ Nginx của máy chủ truy cập được cổng này
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
